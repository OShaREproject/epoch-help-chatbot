<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMU-EPOCH 事務手続き支援チャットボット</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      font-family: "Meiryo", "Hiragino Sans", sans-serif;
      background: #fff6e6;
    }
    .epc-fs-header {
      flex: 0 0 auto;
      background: #c7a21a;
      color: #082c57;
      font-weight: bold;
      font-size: 1rem;
      padding: 12px 16px;
    }
    .epc-fs-frame {
      flex: 1 1 auto;
      width: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="epc-fs-header">OMU-EPOCH　事務手続き支援チャットボット</div>
  <iframe id="epc-fs-frame" class="epc-fs-frame" allow="microphone" title="OMU-EPOCH 事務手続き支援チャットボット"></iframe>

  <script>
    (function () {
      var params = new URLSearchParams({
        token: "94bf7c69-3e5f-46eb-b9c5-af639b85edac",
        title: "OMU-EPOCH　事務手続き支援チャットボット",
        theme: "custom",
        autoHideScrollbar: "false",
        fontSize: "0",
        isHiddenToken: "false",
        messageCallbackEnabled: "false",
        speechRecognitionDisabled: "false",
        speechRecognitionContinuously: "false",
        speechSynthesisDisabled: "false",
        speechVolumeCallbackEnabled: "false",
        inputTextPlaceholder: "",
        inputTextDisabled: "false"
      });

      var colors = {
        header:      { bg: "#c7a21a", font: "#082c57" },
        background:  { bg: "#fff6e6", font: "#9e9e9e" },
        botBalloon:  { bg: "#8ebff9", font: "#141414" },
        userBalloon: { bg: "#ffffff", font: "#141414" },
        sendButton:  { bg: "#1d5c8b", font: "#ffffff" }
      };
      Object.keys(colors).forEach(function (part) {
        Object.keys(colors[part]).forEach(function (key) {
          params.append(part + "_" + key, colors[part][key]);
        });
      });

      document.getElementById("epc-fs-frame").src =
        "https://dialogplay.jp/embedded?" + params.toString();
    })();
  </script>
</body>
</html>
